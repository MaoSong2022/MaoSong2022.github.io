<div class="rl-schedules">
  <style>
    .rl-schedules, .rl-schedules * { box-sizing: border-box; }
    .rl-schedules { --ink: #182b43; --muted: #58697c; --line: #dce3eb; --panel: #f5f7fa; --paper: #fff; color: var(--ink); background: var(--paper); font: 16px/1.6 system-ui, -apple-system, sans-serif; padding: 24px; max-width: 1200px; margin: auto; border-radius: 12px; }
    [data-theme="dark"] .rl-schedules { --ink: #e3eaf4; --muted: #b1bfd1; --line: #3e5067; --panel: #202e40; --paper: #152133; }
    .rl-schedules .rl-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .rl-schedules h3 { color: var(--ink); font-size: 22px; margin: 0; font-weight: 650; }
    .rl-schedules .rl-kicker { color: var(--muted); font-size: 14px; }
    .rl-schedules .rl-tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 5px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; width: fit-content; }
    .rl-schedules button { font: inherit; font-size: 14px; font-weight: 600; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--muted); padding: 8px 16px; cursor: pointer; }
    .rl-schedules button[aria-selected="true"] { color: var(--ink); background: var(--paper); border-color: var(--line); box-shadow: 0 1px 3px #0000000c; }
    .rl-schedules button:focus-visible, .rl-schedules [tabindex]:focus-visible { outline: 3px solid #3c82c9; outline-offset: 3px; }
    .rl-schedules .rl-description { margin: 16px 0 12px; min-height: 52px; }
    .rl-schedules .rl-scroll { overflow-x: auto; padding-bottom: 6px; }
    .rl-schedules svg { display: block; width: 100%; min-width: 880px; height: auto; }
    .rl-schedules svg text { font-family: inherit; fill: var(--ink); font-size: 14px; }
    .rl-schedules svg .rl-small { fill: var(--muted); font-size: 13px; }
    .rl-schedules svg .rl-sample-label { fill: #182b43; font-size: 13px; font-weight: 650; pointer-events: none; }
    .rl-schedules svg .rl-sample { cursor: pointer; }
    .rl-schedules svg .rl-sample:hover > .rl-outline, .rl-schedules svg .rl-sample:focus > .rl-outline { stroke: #152e50; stroke-width: 3; }
    .rl-schedules .rl-legend { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 20px; margin: 12px 0; font-size: 14px; }
    .rl-schedules .rl-key { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
    .rl-schedules .rl-swatch { width: 19px; height: 13px; border: 1px solid #63738b; border-radius: 2px; display: inline-block; }
    .rl-schedules .rl-idle { background: repeating-linear-gradient(135deg, transparent 0 3px, #9daab9 3px 4px, transparent 4px 7px); }
    .rl-schedules .rl-detail { padding: 12px 15px; border-left: 3px solid #7a98b7; background: var(--panel); border-radius: 0 6px 6px 0; min-height: 76px; font-size: 14px; }
    .rl-schedules .rl-note { font-size: 13px; color: var(--muted); margin: 12px 0 0; }
    @media (max-width: 600px) { .rl-schedules { padding: 12px; } .rl-schedules button { padding: 8px 10px; } .rl-schedules h3 { font-size: 20px; } }
    @media print { .rl-schedules { padding: 0; } .rl-schedules .rl-scroll { overflow: visible; } .rl-schedules svg { min-width: 0; } }
  </style>
  <div class="rl-head"><h3>RL training schedules</h3><span class="rl-kicker">4 optimizer steps · B1–B4</span></div>
  <div class="rl-tabs" role="tablist" aria-label="切换 RL 框架">
    <button type="button" role="tab" data-mode="sync" aria-selected="true">Sync RL</button>
    <button type="button" role="tab" data-mode="conventional" aria-selected="false" tabindex="-1">Conventional RL</button>
    <button type="button" role="tab" data-mode="pipeline" aria-selected="false" tabindex="-1">Pipeline RL</button>
  </div>
  <div class="rl-panel" role="tabpanel">
    <p class="rl-description"></p>
    <div class="rl-scroll" tabindex="0" aria-label="训练时间线，小屏幕可横向滚动"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 398" role="img"></svg></div>
    <div class="rl-legend" aria-label="Staleness 图例">
      <strong>Staleness Δ</strong>
      <span class="rl-key"><i class="rl-swatch" style="background:#c4e9e5"></i>0 · on-policy</span>
      <span class="rl-key"><i class="rl-swatch" style="background:#a8ccef"></i>1</span>
      <span class="rl-key"><i class="rl-swatch" style="background:#f5d49a"></i>2</span>
      <span class="rl-key"><i class="rl-swatch" style="background:#e9acb9"></i>3</span>
      <span class="rl-key"><i class="rl-swatch rl-idle"></i>GPU idle</span>
      <span class="rl-key"><i class="rl-swatch" style="background:#e8edf3"></i>尚未用于更新</span>
    </div>
    <div class="rl-detail" role="status" aria-live="polite"></div>
    <p class="rl-note">B1–B4 表示训练批次，每批 4 个样本；每条横条是一个样本，行表示 4 个并行 inference slots。颜色按样本被训练时回看：Δ = n − k，n 为该次更新前的 trainer 版本，k 为生成该段 token 的版本。时间为示意单位，不代表实测加速比。悬停、点击或用 Tab 聚焦样本可查看详情。</p>
  </div>
  <noscript>请启用 JavaScript 以查看并切换 RL 训练时间线。</noscript>
</div>
<script>
(() => {
  // Works both as a standalone fragment and with HtmlEmbed's lazy script execution.
  document.querySelectorAll('.rl-schedules:not([data-mounted])').forEach(root => {
    root.dataset.mounted = 'true';
    const uid = 'rls-' + Math.random().toString(36).slice(2);
    const svg = root.querySelector('svg');
    const panel = root.querySelector('.rl-panel');
    const detail = root.querySelector('.rl-detail');
    const tabs = [...root.querySelectorAll('[role="tab"]')];
    const NS = 'http://www.w3.org/2000/svg';
    const colors = ['#c4e9e5', '#a8ccef', '#f5d49a', '#e9acb9'];
    const descriptions = {
      sync: '生成一次，更新一次，共 4 轮。每轮等待全部样本完成，再更新并同步权重；所有样本在使用时 Δ = 0。',
      conventional: '一次 rollout 收集 16 个样本，再按 B1–B4 做 4 次更新。生成阶段始终使用 θ₀，后续 mini-batch 的 staleness 依次增加。',
      pipeline: '持续补入新样本，每收齐 4 个完成的样本就更新一次，共展示 4 次更新。更新结束后立即同步权重，正在生成的样本也切换到新版本。'
    };
    const notes = {
      sync: 'Sync RL：B1 用 θ₀ 生成并更新 θ₀ → θ₁；B2–B4 依次使用最新权重。斜线区域表示等待长样本或等待参数更新。',
      conventional: 'Conventional RL：B1、B2、B3、B4 都由 θ₀ 生成，但分别用于更新 θ₀、θ₁、θ₂、θ₃，因此 Δ = 0、1、2、3。',
      pipeline: 'Pipeline RL：同一样本可包含多个版本生成的 token。对同一次训练而言，较早的 token 通常更陈旧；较晚的 token 在权重同步后更接近 trainer。灰色样本尚未被前 4 次更新使用。'
    };
    panel.id = uid + '-panel';
    tabs.forEach(tab => { tab.id = uid + '-' + tab.dataset.mode; tab.setAttribute('aria-controls', panel.id); });

    function node(tag, attrs = {}, text, parent = svg) {
      const el = document.createElementNS(NS, tag);
      Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
      if (text !== undefined) el.textContent = text;
      parent.appendChild(el);
      return el;
    }
    function model(mode) {
      const samples = [], updates = [];
      if (mode === 'sync') {
        for (let batch = 0; batch < 4; batch++) {
          const start = batch * 8;
          [4, 3, 5, 2].forEach((duration, lane) => samples.push({ lane, start, end: start + duration, batch, version: batch }));
          updates.push({ start: start + 5, end: start + 8 });
        }
        return { samples, updates, end: 32, caption: 'Rollout → update → sync · repeat × 4' };
      }
      if (mode === 'conventional') {
        // A finite rollout pool uses four slots. Completed slots are refilled until
        // all 16 prompts have been dispatched; the final stragglers leave idle slots.
        const durations = [[4, 3, 4, 5], [3, 4, 3, 3], [5, 4, 4, 5], [2, 3, 4, 3]];
        durations.forEach((row, lane) => {
          let start = 0;
          row.forEach((duration, batch) => {
            samples.push({ lane, start, end: start + duration, batch, version: 0 });
            start += duration;
          });
        });
        const endRollout = Math.max(...samples.map(s => s.end));
        for (let i = 0; i < 4; i++) updates.push({ start: endRollout + i * 3, end: endRollout + (i + 1) * 3 });
        return { samples, updates, end: endRollout + 12, caption: 'One rollout pool · fixed θ₀ · four mini-batch updates' };
      }
      const durations = [[18, 5, 4, 5, 4], [3, 4, 4, 3, 4, 3, 4, 3, 4], [4, 3, 3, 3, 4, 3, 4, 3, 4], [5, 3, 4, 4, 3, 3, 4, 3, 4]];
      durations.forEach((row, lane) => {
        let start = 0;
        row.forEach(duration => { samples.push({ lane, start, end: start + duration, batch: null }); start += duration; });
      });
      const completed = [...samples].sort((a, b) => a.end - b.end || a.lane - b.lane);
      for (let batch = 0; batch < 4; batch++) {
        const group = completed.slice(batch * 4, batch * 4 + 4);
        group.forEach(sample => { sample.batch = batch; });
        const start = Math.max(group[3].end, updates[batch - 1]?.end || 0);
        updates.push({ start, end: start + 3 });
      }
      const end = updates[3].end;
      return { samples: samples.filter(s => s.start < end), updates, end, caption: 'Continuous inference · inflight weight updates' };
    }

    function render(mode) {
      const data = model(mode);
      root.dataset.mode = mode;
      root.querySelector('.rl-description').textContent = descriptions[mode];
      detail.textContent = notes[mode];
      tabs.forEach(tab => {
        const active = tab.dataset.mode === mode;
        tab.setAttribute('aria-selected', String(active));
        tab.tabIndex = active ? 0 : -1;
      });
      panel.setAttribute('aria-labelledby', uid + '-' + mode);
      svg.replaceChildren();
      svg.setAttribute('aria-labelledby', uid + '-title ' + uid + '-desc');
      node('title', { id: uid + '-title' }, tabs.find(t => t.dataset.mode === mode).textContent + ' — four optimizer steps');
      node('desc', { id: uid + '-desc' }, descriptions[mode] + ' ' + notes[mode]);
      const defs = node('defs');
      const pattern = node('pattern', { id: uid + '-idle', width: 7, height: 7, patternUnits: 'userSpaceOnUse' }, undefined, defs);
      node('path', { d: 'M-2,2 L2,-2 M0,7 L7,0 M5,9 L9,5', stroke: '#a0adbc', 'stroke-width': .8 }, undefined, pattern);
      const x0 = 112, right = 1050, width = right - x0;
      const x = t => x0 + t / data.end * width;
      const rect = (start, end, y, height, attrs = {}, parent = svg) => node('rect', { x: x(start), y, width: x(end) - x(start), height, ...attrs }, undefined, parent);
      node('text', { x: x0, y: 22, 'font-weight': 600 }, data.caption);
      node('text', { x: 10, y: 64, class: 'rl-small' }, 'Generator');
      for (let lane = 0; lane < 4; lane++) {
        const y = 78 + lane * 44;
        node('text', { x: 10, y: y + 22 }, 'Slot ' + (lane + 1));
        rect(0, data.end, y, 32, { fill: 'url(#' + uid + '-idle)', stroke: 'var(--line)' });
      }
      node('text', { x: 10, y: 294 }, 'Trainer');
      rect(0, data.end, 269, 48, { fill: 'url(#' + uid + '-idle)', stroke: 'var(--line)' });
      data.updates.forEach((update, i) => {
        rect(update.start, update.end, 269, 48, { fill: 'var(--panel)', stroke: 'var(--muted)', rx: 3, 'data-update': i });
        const mid = (x(update.start) + x(update.end)) / 2;
        node('text', { x: mid, y: 289, 'text-anchor': 'middle', 'font-weight': 650 }, 'Step ' + i);
        node('text', { x: mid, y: 307, 'text-anchor': 'middle', class: 'rl-small' }, 'B' + (i + 1));
        node('line', { x1: x(update.end), x2: x(update.end), y1: 46, y2: 260, stroke: 'var(--muted)', 'stroke-dasharray': '3 5', opacity: .65 });
        node('text', { x: x(update.end) - 3, y: 57, 'text-anchor': 'end', class: 'rl-small' }, 'θ' + (i + 1));
      });
      node('text', { x: x0, y: 57, class: 'rl-small' }, 'θ0');

      data.samples.forEach((sample, index) => {
        const end = Math.min(sample.end, data.end), y = 78 + sample.lane * 44;
        const trained = sample.batch !== null;
        const label = trained ? 'B' + (sample.batch + 1) : '…';
        const cuts = mode === 'pipeline' ? data.updates.map(u => u.end).filter(t => t > sample.start && t < end) : [];
        const boundaries = [sample.start, ...cuts, end];
        const segments = boundaries.slice(0, -1).map((start, i) => {
          const version = mode === 'pipeline' ? data.updates.filter(u => u.end <= start).length : sample.version;
          return { start, end: boundaries[i + 1], version, delta: trained ? sample.batch - version : null };
        });
        const info = 'Sample ' + (index + 1) + ' · Slot ' + (sample.lane + 1) + ' · ' + (trained ? label + ' / Step ' + sample.batch + '（更新前 θ' + sample.batch + '）' : '尚未用于前 4 次更新') + '。' + segments.map(s => 't=' + s.start + '–' + s.end + '：θ' + s.version + (trained ? '，Δ=' + s.delta : '')).join('；') + '。';
        const g = node('g', { class: 'rl-sample', tabindex: 0, role: 'img', 'aria-label': info, 'data-batch': trained ? sample.batch + 1 : 'pending' });
        node('title', {}, info, g);
        segments.forEach(s => rect(s.start, s.end, y, 32, { fill: trained ? colors[s.delta] : '#e8edf3', 'data-staleness': s.delta === null ? 'pending' : s.delta }, g));
        segments.slice(1).forEach(s => node('line', { x1: x(s.start), x2: x(s.start), y1: y, y2: y + 32, stroke: '#64768a', 'stroke-width': 1 }, undefined, g));
        rect(sample.start, end, y, 32, { class: 'rl-outline', fill: 'none', stroke: '#63738b', 'stroke-width': 1.3, 'stroke-dasharray': trained ? 'none' : '4 3' }, g);
        node('text', { x: (x(sample.start) + x(end)) / 2, y: y + 21, 'text-anchor': 'middle', class: 'rl-sample-label' }, label, g);
        ['pointerenter', 'focus', 'click'].forEach(event => g.addEventListener(event, () => { detail.textContent = info; }));
      });
      node('line', { x1: x0, x2: right, y1: 348, y2: 348, stroke: 'var(--ink)', 'stroke-width': 1.5 });
      node('path', { d: 'M1044,344 L1051,348 L1044,352', fill: 'none', stroke: 'var(--ink)', 'stroke-width': 1.5 });
      for (let t = 0; t <= data.end; t += 2) {
        node('line', { x1: x(t), x2: x(t), y1: 348, y2: 353, stroke: 'var(--muted)' });
        node('text', { x: x(t), y: 372, 'text-anchor': 'middle', class: 'rl-small' }, t);
      }
      node('text', { x: right, y: 394, 'text-anchor': 'end', class: 'rl-small' }, 'Time · schematic units');
    }
    tabs.forEach((tab, i) => {
      tab.addEventListener('click', () => render(tab.dataset.mode));
      tab.addEventListener('keydown', event => {
        let next;
        if (event.key === 'ArrowRight') next = (i + 1) % tabs.length;
        if (event.key === 'ArrowLeft') next = (i + tabs.length - 1) % tabs.length;
        if (event.key === 'Home') next = 0;
        if (event.key === 'End') next = tabs.length - 1;
        if (next === undefined) return;
        event.preventDefault();
        tabs[next].focus();
        render(tabs[next].dataset.mode);
      });
    });
    render('sync');
  });
})();
</script>
